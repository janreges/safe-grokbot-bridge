name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish only from a tag that matches the crate version, and only what passes the full CI
  # (lint, tests on Linux, macOS and Windows, MSRV).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # Cross-compiled: ARM runners are not available to every (private) repository.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the aarch64 cross compiler
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="safe-grokbot-bridge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          # The documentation goes along, so the README's relative links work in the archive.
          cp "target/${{ matrix.target }}/release/safe-grokbot-bridge" "$name/"
          cp -R README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md LICENSE docs "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "safe-grokbot-bridge-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/safe-grokbot-bridge.exe" $name
          Copy-Item -Recurse README.md, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, LICENSE, docs $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            safe-grokbot-bridge-*.tar.gz
            safe-grokbot-bridge-*.zip
            safe-grokbot-bridge-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { f = index($0, "## [" v "]") == 1; next } /^\[[^]]*\]: / { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: safe-grokbot-bridge-*
          body_path: notes.md
