[package]
name = "safe-grokbot-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A secure HTTP bridge that lets a remote AI agent such as Grok Bot read your projects and drive Claude Code, Codex and Hermes sessions on your machines"
license = "MIT"
repository = "https://github.com/janreges/safe-grokbot-bridge"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "tmux", "grok"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]
exclude = [".github/", ".plans/"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
dunce = "1"
getrandom = "0.4"
globset = "0.4"
humantime = "2"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
ignore = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
